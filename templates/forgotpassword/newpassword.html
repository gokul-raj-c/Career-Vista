<!DOCTYPE html>
<html lang="zxx">

<head>
    <title>Service login form Responsive Widget Template : W3Layouts</title>

    <!-- Meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Google fonts -->
    <link href="//fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/forgotpassword/css/style.css') }}" type="text/css" media="all" />

 <style>
        .error-message {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
        }

		.home-button {
        position: absolute;
        top: 20px;
        right: 30px;
        background-color: #ffffff;
        color: rgb(0, 0, 0);
        padding: 8px 16px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 0.95em;
        transition: background-color 0.3s ease;
        z-index: 1000;
    }

    .home-button:hover {
        background-color: #76b8ff;
    }
    </style>

<script>
    function validateForm(event) {
        const newpass = document.forms["passwordForm"]["newpass"].value.trim();
        const confirmpass = document.forms["passwordForm"]["confirmpass"].value.trim();
       
        let valid = true;

        // Clear previous error messages
        document.querySelectorAll(".error-message").forEach(el => el.innerText = "");

        // Email: basic format check
        // Check if password is empty
    if (newpass.length < 6) {
        document.getElementById("newpassError").innerText = "Password must be at least 6 characters.";
        valid = false;
    } else if (!/(?=.*[a-zA-Z])(?=.*\d)/.test(newpass)) {
            document.getElementById("newpassError").innerText = "Password must contain letters and numbers.";
            valid = false;
        }

    // Check confirm password match
    if (newpass !== confirmpass) {
        document.getElementById("confirmpassError").innerText = "Passwords do not match.";
        valid = false;
    }


        // Stop form submission if any validation failed
        if (!valid) {
            event.preventDefault();
        }

        return valid;
    }
</script>
</head>


<body>
    <div class="signinform">
        <!-- container -->
        <div class="container">
            <!-- main content -->
            <div class="w3l-form-info">
                <div class="w3_info">
                    <h2>Set New Password</h2>
                    <form name="passwordForm" action="{{ url_for('setnewpassword') }}" method="post" onsubmit="return validateForm(event)">
                        <div class="input-group">
                            <span><i class="fas fa-user" aria-hidden="true"></i></span>
                            <input type="password" name="newpass" placeholder="New Password" >
                        </div>
                       <div id="newpassError" class="error-message"></div>
                        <div class="input-group">
                            <span><i class="fas fa-key" aria-hidden="true"></i></span>
                            <input type="password" name="confirmpass" placeholder="Confirm Password" >
                        </div>
                        <div id="confirmpassError" class="error-message"></div>
                        
                        <button class="btn btn-primary btn-block" type="submit" style="background-color: #008374; color: white;">Set Password</button>
                    </form>
                    
            </div>
            <!-- //main content -->
        </div>
        <!-- //container -->
        <!-- footer -->
        <div class="footer">
        <!-- footer -->
    </div>

    <!-- fontawesome v5-->
    <script src="js/fontawesome.js"></script>

</body>

</html>
